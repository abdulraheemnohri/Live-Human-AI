# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style for this project
kotlin.code.style=official

# Enable Gradle caching
org.gradle.caching=true

# Enable parallel builds
org.gradle.parallel=true

# Enable daemon for faster builds
org.gradle.daemon=true

# NDK version
android.ndkVersion=25.2.9519653

# CMake version
android.cmakeVersion=3.10.2

# Disable build scan
org.gradle.unsupported.build-scan.api-url=
org.gradle.unsupported.build-scan.terms-of-service-url=
org.gradle.unsupported.build-scan.terms-of-service-agree=yes
