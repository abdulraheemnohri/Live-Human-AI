name: Build Debug APK

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Compile Native C++ Libraries
        run: |
          mkdir -p /tmp/android
          cat << 'EOF' > /tmp/android/log.h
          #ifndef ANDROID_LOG_H
          #define ANDROID_LOG_H
          #define ANDROID_LOG_VERBOSE 2
          #define ANDROID_LOG_DEBUG 3
          #define ANDROID_LOG_INFO 4
          #define ANDROID_LOG_WARN 5
          #define ANDROID_LOG_ERROR 6
          #define ANDROID_LOG_FATAL 7
          #define __android_log_print(prio, tag, ...) ((void)0)
          #endif
          EOF
          g++ -std=c++17 -shared -fPIC -I /tmp -I app/src/main/cpp -I app/src/main/cpp/core -I app/src/main/cpp/ai -I app/src/main/cpp/ai/llm -I app/src/main/cpp/ai/stt -I app/src/main/cpp/ai/tts -I app/src/main/cpp/ai/vision -I app/src/main/cpp/audio -I app/src/main/cpp/memory -I app/src/main/cpp/hardware -I app/src/main/cpp/scheduler -I app/src/main/cpp/security -I app/src/main/cpp/jni -I app/src/main/cpp/utils app/src/main/cpp/core/NativeCore.cpp app/src/main/cpp/core/NativeEngine.cpp app/src/main/cpp/ai/AIEngine.cpp app/src/main/cpp/ai/ModelRouter.cpp app/src/main/cpp/ai/llm/LLMManager.cpp app/src/main/cpp/ai/stt/STTManager.cpp app/src/main/cpp/ai/tts/TTSManager.cpp app/src/main/cpp/ai/vision/VisionManager.cpp app/src/main/cpp/hardware/HardwareProfiler.cpp app/src/main/cpp/hardware/ThermalMonitor.cpp app/src/main/cpp/hardware/BatteryMonitor.cpp app/src/main/cpp/scheduler/TaskScheduler.cpp app/src/main/cpp/utils/Logger.cpp -o app/src/main/jniLibs/arm64-v8a/libnative-core.so || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || gradle wrapper

      - name: Build Debug APK
        run: ./gradlew assembleDebug || gradle assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-human-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
