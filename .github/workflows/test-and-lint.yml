name: Test and Find Errors

on:
  push:
    branches: [ main, master, "jules-*", "feature/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Test Code and Find Bugs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run JCL policy unit tests
        run: |
          cat << 'EOF' > /tmp/test_jcl_policy.cpp
          #include <cassert>
          #include "JalebiWorldState.h"
          #include "JalebiModelEscalator.h"
          #include "JalebiMemoryPolicy.h"
          using namespace LiveHumanAI;
          int main() {
              JalebiWorldStateTracker tracker;
              JalebiWorldState a; a.sceneId = "desk"; a.detectedObjects = {"document"};
              assert(tracker.update(a));
              JalebiWorldState b = a;
              assert(!tracker.update(b));
              JalebiWorldState c = a; c.detectedText = {"Name"};
              assert(tracker.update(c));
              auto small = JalebiModelEscalator::choose(0.95f, false, true);
              auto medium = JalebiModelEscalator::choose(0.50f, false, false);
              auto degraded = JalebiModelEscalator::choose(0.20f, true, true);
              assert(small.tier == JalebiModelEscalator::Tier::SMALL);
              assert(medium.tier == JalebiModelEscalator::Tier::MEDIUM);
              assert(degraded.degraded);
              JalebiMemoryPolicy::Candidate candidate{"stable preference", 0.95f, true, false};
              assert(JalebiMemoryPolicy::shouldStore(candidate));
              candidate.sensitive = true;
              assert(!JalebiMemoryPolicy::shouldStore(candidate));
              return 0;
          }
          EOF
          g++ -std=c++17 -I app/src/main/cpp/ai /tmp/test_jcl_policy.cpp -o /tmp/test_jcl_policy
          /tmp/test_jcl_policy
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || gradle wrapper
      - name: Run Android Unit Tests
        run: ./gradlew test
      - name: Run Android Lint Checks
        run: ./gradlew lint
